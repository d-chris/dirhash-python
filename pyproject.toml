[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools", "versioneer==0.29" ]

[tool.ruff]
target-version = "py38"
lint.select = [
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "UP", # pyupgrade
  "W",  # pycodestyle warnings
]
lint.isort.known-local-folder = [ "dirhash" ]
